<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Subo 标志</title>
<link rel="icon" href="subo-icon.svg" />
<style>
  :root { --ink: #1f3a33; --accent: #2f7d63; --bg: #f7f8f7; --line: #e3e7e5; --muted: #6b7a75; }
  body { margin: 0; padding: 40px 24px; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  main { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 14px; font-weight: 600; margin: 40px 0 12px; color: var(--muted); }
  p { margin: 0; color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .tile { width: 160px; height: 160px; border-radius: 12px; border: 1px solid var(--line);
    display: grid; place-items: center; background: #fff; }
  .tile.dark { background: var(--ink); border-color: var(--ink); }
  img { display: block; }
  .bar { display: flex; align-items: center; gap: 10px; background: var(--ink); color: #fff;
    padding: 0 16px; height: 44px; border-radius: 8px; font-weight: 600; font-size: 15px; }
  .bar span { color: #9dc0b4; font-weight: 400; }

  /* 编译状态：点沿斜杠滑下，落到基线 */
  .anim .dot { transition: fill .2s; }
  .anim.compiling .dot { animation: slide 1.1s cubic-bezier(.5,0,.3,1) infinite; }
  .anim.missing .dot { fill: #e0a63a; }
  @keyframes slide {
    0%   { transform: translate(-46px, -56px); opacity: 0; }
    12%  { opacity: 1; }
    62%  { transform: translate(-20px, 2px); }
    100% { transform: translate(0, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .anim.compiling .dot { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
  }
  button { font: inherit; font-size: 12px; padding: 4px 10px; border: 1px solid var(--line);
    background: #fff; border-radius: 6px; cursor: pointer; color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1>Subo 标志</h1>
  <p>反斜杠是每条 LaTeX 命令的开头，点是写完的那一笔。两笔，不能再少。</p>

  <h2>标志与图标</h2>
  <div class="row">
    <div class="cell"><div class="tile"><img src="subo-mark.svg" width="120" alt="" /></div>标志</div>
    <div class="cell"><div class="tile dark"><img src="subo-mark-inverse.svg" width="120" alt="" /></div>反白</div>
    <div class="cell"><div class="tile"><img src="subo-icon.svg" width="120" alt="" /></div>图标</div>
    <div class="cell"><div class="tile"><img src="subo-icon-light.svg" width="120" alt="" /></div>浅色图标</div>
    <div class="cell"><div class="tile"><img src="subo-icon-1024.png" width="140" alt="" /></div>macOS</div>
  </div>

  <h2>小尺寸</h2>
  <div class="row">
    <div class="cell"><img src="subo-icon.svg" width="64" alt="" />64</div>
    <div class="cell"><img src="subo-icon.svg" width="32" alt="" />32</div>
    <div class="cell"><img src="subo-icon.svg" width="16" alt="" />16</div>
    <div class="cell"><img src="subo-mark.svg" width="32" alt="" />32</div>
    <div class="cell"><img src="subo-mark.svg" width="16" alt="" />16</div>
  </div>

  <h2>页头</h2>
  <div class="bar"><img src="subo-mark-inverse.svg" width="22" alt="" />素帛 <span>Subo</span></div>

  <h2>编译状态</h2>
  <div class="row">
    <div class="cell">
      <div class="tile dark">
        <svg id="live" class="anim compiling" viewBox="0 0 120 120" width="120">
          <line x1="36" y1="30" x2="62" y2="88" stroke="#f7f8f7" stroke-width="12" stroke-linecap="round" />
          <circle class="dot" cx="82" cy="86" r="8" fill="#6fcf9f" />
        </svg>
      </div>
      <div class="row" style="gap:6px">
        <button data-s="compiling">编译中</button>
        <button data-s="">完成</button>
        <button data-s="missing">缺包</button>
      </div>
    </div>
  </div>
  <p style="margin-top:12px">编译中：点从斜杠顶端滑下，落到基线；完成：点停住；缺包：点变琥珀色。系统开启「减少动态效果」时改为原地呼吸。</p>
</main>
<script>
  const live = document.getElementById("live");
  document.querySelectorAll("button[data-s]").forEach((b) =>
    b.addEventListener("click", () => { live.setAttribute("class", "anim " + b.dataset.s); }));
</script>
</body>
</html>
