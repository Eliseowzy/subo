[package]
name = "subo-desktop"
version = "0.0.3"
edition = "2021"
license = "Apache-2.0"
description = "Subo 桌面壳：在自己进程里起本地服务，窗口指向它"

[[bin]]
name = "subo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dunce = "1.0.5"
serde_json = "1"
subo-server = { path = "../server" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["net", "time"] }
url = "2"

# 两档构建（scripts/desktop.sh bundle 选档）。本机 10 核实测，改一行 server 后重编：
# release 约 3s，dist 约 150s。两档产物目录分开（target/release、target/dist），缓存互不冲掉
# 日常打包、本机自测：不做 LTO，开增量编译
[profile.release]
codegen-units = 16
incremental = true
lto = false
strip = true

# 发版：fat LTO + 单 codegen unit，体积最小、运行最快，编译慢。CI 出的安装包用这一档
[profile.dist]
inherits = "release"
codegen-units = 1
incremental = false
lto = true
