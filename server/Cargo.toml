[package]
name = "subo-server"
version = "0.0.3"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "subo_server"
path = "src/lib.rs"

[[bin]]
name = "subo-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
libc = "0.2"
sha2 = "0.10"
tower-http = { version = "0.5", features = ["fs"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2"] }
dunce = "1.0.5"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Credentials", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_SystemInformation"] }
